name: Docker Image CI (dev)

# Builds and publishes a container image from the "dev" branch.
# Images are tagged "dev" (latest dev build) and "dev-<short sha>"; the "latest"
# and "edge" tags produced from main by docker.yml are never touched.

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only build the newest push to dev
concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Multi-arch support (the image is used on both x86 and arm)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker create tag meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/canofsocks/livestream_dl
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
